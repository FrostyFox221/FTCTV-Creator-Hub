openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FTCTV.Online API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: News posts
  - name: telegram
    description: Telegram sync
  - name: admin
    description: Admin operations
  - name: livestream
    description: Live stream management
  - name: settings
    description: Site settings
  - name: maintenance
    description: Maintenance mode
  - name: schedule
    description: Broadcast schedule
  - name: articles
    description: Author articles
  - name: forum
    description: Community forum
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /posts:
    get:
      operationId: getPosts
      tags: [posts]
      summary: Get all news posts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsPage"
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a post (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Unauthorized

  /posts/{id}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get a single post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
    put:
      operationId: updatePost
      tags: [posts]
      summary: Update a post (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          description: Unauthorized
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized

  /telegram/sync:
    post:
      operationId: syncTelegram
      tags: [telegram]
      summary: Sync posts from Telegram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramSyncInput"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSyncResult"
        "401":
          description: Unauthorized

  /telegram/status:
    get:
      operationId: getTelegramStatus
      tags: [telegram]
      summary: Get Telegram sync status
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResult"
        "401":
          description: Invalid credentials

  /livestream:
    get:
      operationId: getLivestream
      tags: [livestream]
      summary: Get current livestream configuration
      responses:
        "200":
          description: Livestream config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Livestream"
    put:
      operationId: updateLivestream
      tags: [livestream]
      summary: Update livestream (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LivestreamInput"
      responses:
        "200":
          description: Updated livestream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Livestream"
        "401":
          description: Unauthorized

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get site settings
      responses:
        "200":
          description: Site settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update site settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          description: Unauthorized

  /schedule:
    get:
      operationId: getSchedule
      tags: [schedule]
      summary: Get broadcast schedule
      responses:
        "200":
          description: Schedule items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleItem"
    post:
      operationId: createScheduleItem
      tags: [schedule]
      summary: Create schedule item (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "401":
          description: Unauthorized

  /schedule/{id}:
    put:
      operationId: updateScheduleItem
      tags: [schedule]
      summary: Update schedule item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleItem"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteScheduleItem
      tags: [schedule]
      summary: Delete schedule item (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized

  /articles:
    get:
      operationId: getArticles
      tags: [articles]
      summary: Get articles
      responses:
        "200":
          description: Articles list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticlesPage"
    post:
      operationId: createArticle
      tags: [articles]
      summary: Create article (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          description: Unauthorized

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get single article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
    put:
      operationId: updateArticle
      tags: [articles]
      summary: Update article (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArticleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteArticle
      tags: [articles]
      summary: Delete article (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized

  /forum/topics:
    get:
      operationId: getForumTopics
      tags: [forum]
      summary: Get forum topics
      responses:
        "200":
          description: Topics list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopicsPage"
    post:
      operationId: createForumTopic
      tags: [forum]
      summary: Create forum topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumTopicInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopic"

  /forum/topics/{id}:
    get:
      operationId: getForumTopic
      tags: [forum]
      summary: Get topic with replies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Topic with replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumTopicDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteForumTopic
      tags: [forum]
      summary: Delete topic (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized

  /forum/topics/{id}/replies:
    post:
      operationId: createForumReply
      tags: [forum]
      summary: Post a reply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumReplyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumReply"
        "404":
          description: Topic not found

  /forum/replies/{id}:
    delete:
      operationId: deleteForumReply
      tags: [forum]
      summary: Delete reply (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.

  /maintenance:
    get:
      operationId: getMaintenanceStatus
      tags: [maintenance]
      summary: Get current maintenance status
      responses:
        "200":
          description: Maintenance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceStatus"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Post:
      type: object
      required: [id, title, content, createdAt, source]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        images:
          type: array
          items:
            type: string
        videoUrl:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]
        source:
          type: string
          enum: [telegram, admin]
        telegramMessageId:
          type: ["integer", "null"]
        published:
          type: boolean

    PostsPage:
      type: object
      required: [posts, total, page, limit]
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    PostInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        images:
          type: array
          items:
            type: string
        videoUrl:
          type: ["string", "null"]
        published:
          type: boolean

    Livestream:
      type: object
      required: [id, isLive]
      properties:
        id:
          type: integer
        isLive:
          type: boolean
        streamUrl:
          type: ["string", "null"]
        streamType:
          type: ["string", "null"]
          enum: [youtube, vk, telegram, null]
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]

    LivestreamInput:
      type: object
      required: [isLive]
      properties:
        isLive:
          type: boolean
        streamUrl:
          type: ["string", "null"]
        streamType:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]

    SiteSettings:
      type: object
      required: [id, siteName, logoUrl, telegramChannel]
      properties:
        id:
          type: integer
        siteName:
          type: string
        logoUrl:
          type: ["string", "null"]
        telegramChannel:
          type: string
        telegramBotToken:
          type: ["string", "null"]
        footerText:
          type: string
        contactEmail:
          type: string
        autoSyncEnabled:
          type: boolean
        syncIntervalMinutes:
          type: integer
        bannerEnabled:
          type: boolean
        bannerTitle:
          type: ["string", "null"]
        bannerText:
          type: ["string", "null"]
        bannerImageUrl:
          type: ["string", "null"]
        bannerLink:
          type: ["string", "null"]

    SiteSettingsInput:
      type: object
      properties:
        siteName:
          type: string
        logoUrl:
          type: ["string", "null"]
        telegramChannel:
          type: string
        telegramBotToken:
          type: ["string", "null"]
        footerText:
          type: string
        contactEmail:
          type: string
        autoSyncEnabled:
          type: boolean
        syncIntervalMinutes:
          type: integer
        bannerEnabled:
          type: boolean
        bannerTitle:
          type: ["string", "null"]
        bannerText:
          type: ["string", "null"]
        bannerImageUrl:
          type: ["string", "null"]
        bannerLink:
          type: ["string", "null"]

    TelegramSyncInput:
      type: object
      required: [adminToken]
      properties:
        adminToken:
          type: string
        limit:
          type: integer
          default: 50

    TelegramSyncResult:
      type: object
      required: [synced, skipped, errors]
      properties:
        synced:
          type: integer
        skipped:
          type: integer
        errors:
          type: integer
        message:
          type: string

    TelegramStatus:
      type: object
      required: [lastSync, totalPosts]
      properties:
        lastSync:
          type: ["string", "null"]
        totalPosts:
          type: integer
        telegramChannel:
          type: string
        autoSyncEnabled:
          type: boolean

    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminAuthResult:
      type: object
      required: [success, token]
      properties:
        success:
          type: boolean
        token:
          type: string

    MaintenanceStatus:
      type: object
      required: [isActive, endsAt]
      properties:
        isActive:
          type: boolean
        endsAt:
          type: ["string", "null"]
        message:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    ScheduleItem:
      type: object
      required: [id, dayOfWeek, timeSlot, title]
      properties:
        id:
          type: integer
        dayOfWeek:
          type: integer
        timeSlot:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        genre:
          type: ["string", "null"]
        createdAt:
          type: string

    ScheduleItemInput:
      type: object
      required: [dayOfWeek, timeSlot, title]
      properties:
        dayOfWeek:
          type: integer
        timeSlot:
          type: string
        title:
          type: string
        description:
          type: ["string", "null"]
        genre:
          type: ["string", "null"]

    Article:
      type: object
      required: [id, title, content, authorName, published, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        authorName:
          type: string
        published:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    ArticlesPage:
      type: object
      required: [articles, total]
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer

    ArticleInput:
      type: object
      required: [title, content, authorName]
      properties:
        title:
          type: string
        content:
          type: string
        authorName:
          type: string
        published:
          type: boolean

    ForumTopic:
      type: object
      required: [id, title, category, authorName, replyCount, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        authorName:
          type: string
        replyCount:
          type: integer
        createdAt:
          type: string

    ForumTopicsPage:
      type: object
      required: [topics, total]
      properties:
        topics:
          type: array
          items:
            $ref: "#/components/schemas/ForumTopic"
        total:
          type: integer

    ForumTopicInput:
      type: object
      required: [title, authorName]
      properties:
        title:
          type: string
        category:
          type: string
        authorName:
          type: string

    ForumReply:
      type: object
      required: [id, topicId, authorName, content, createdAt]
      properties:
        id:
          type: integer
        topicId:
          type: integer
        authorName:
          type: string
        content:
          type: string
        createdAt:
          type: string

    ForumTopicDetail:
      type: object
      required: [topic, replies]
      properties:
        topic:
          $ref: "#/components/schemas/ForumTopic"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/ForumReply"

    ForumReplyInput:
      type: object
      required: [authorName, content]
      properties:
        authorName:
          type: string
        content:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
